server:
  port: ${PORT:2333}   # ใช้ค่าจาก Render (PORT) ถ้ามี ไม่งั้น fallback เป็น 2333
  address: 0.0.0.0

lavalink:
  server:
    # รหัสผ่านอ่านจาก environment variable LAVALINK_SERVER_PASSWORD (ตั้งเองบน Render)
    # ห้ามใส่รหัสผ่านตรงๆ ในไฟล์นี้ เพราะจะถูก push ขึ้น GitHub
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      youtube: false     # ปิด source เดิมที่ถูกถอดออกจาก core แล้ว — ใช้ plugin ข้างล่างแทน
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    trackStuckThresholdMs: 10000
    playerUpdateInterval: 5

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.5"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    oauth:
      enabled: true   # เปิด OAuth — ครั้งแรกที่สตาร์ท จะมีลิงก์+โค้ดโผล่ใน log ให้ไปยืนยันตัวตน
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 3
